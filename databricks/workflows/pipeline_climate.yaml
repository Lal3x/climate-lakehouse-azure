resources:
  jobs:
    Pipeline_CLIMATE:
      name: Pipeline_CLIMATE
      tasks:
        - task_key: Bronze_inmet_estacao
          notebook_task:
            notebook_path: databricks/bronze/ingest_raw
            base_parameters:
              source_system: inmet
              source_path: /Volumes/climate/bronze/landing/inmet/estacao/
              file_format: csv
              target_table: climate.bronze.inmet_estacao_raw
              ingestion_date: "{{job.parameters.ingestion_date}}"
              schema_location: /Volumes/climate/bronze/landing/_schema/inmet/estacao/
              checkpoint_location: /Volumes/climate/bronze/landing/_checkpoint/inmet/estacao/
            source: GIT
        - task_key: Bronze_inmet_microdados
          notebook_task:
            notebook_path: databricks/bronze/ingest_raw
            base_parameters:
              source_system: inmet
              source_path: /Volumes/climate/bronze/landing/inmet/microdados/
              file_format: csv
              target_table: climate.bronze.inmet_microdados_raw
              ingestion_date: "{{job.parameters.ingestion_date}}"
              schema_location: /Volumes/climate/bronze/landing/_schema/inmet/microdados/
              checkpoint_location: /Volumes/climate/bronze/landing/_checkpoint/inmet/microdados/
            source: GIT
        - task_key: Bronze_visualCrossing
          notebook_task:
            notebook_path: databricks/bronze/ingest_raw
            base_parameters:
              source_system: visualcrossing
              source_path: /Volumes/climate/bronze/landing/visualcrossing/
              file_format: json
              target_table: climate.bronze.visual_crossing_raw
              ingestion_date: "{{job.parameters.ingestion_date}}"
              schema_location: /Volumes/climate/bronze/landing/_schema/visualcrossing/
              checkpoint_location: /Volumes/climate/bronze/landing/_checkpoint/visualcrossing/
            source: GIT
        - task_key: Silver_inmet
          depends_on:
            - task_key: Bronze_inmet_estacao
            - task_key: Bronze_inmet_microdados
          notebook_task:
            notebook_path: databricks/silver/transform_inmet
            base_parameters:
              ingestion_date: "{{job.parameters.ingestion_date}}"
            source: GIT
        - task_key: Silver_visualCrossing
          depends_on:
            - task_key: Bronze_visualCrossing
          notebook_task:
            notebook_path: databricks/silver/transform_visualcrossing
            base_parameters:
              ingestion_date: "{{job.parameters.ingestion_date}}"
            source: GIT
        - task_key: Silver_unified
          depends_on:
            - task_key: Silver_inmet
            - task_key: Silver_visualCrossing
          notebook_task:
            notebook_path: databricks/silver/transform_unified
            base_parameters:
              ingestion_date: "{{job.parameters.ingestion_date}}"
            source: GIT
        - task_key: Gold
          depends_on:
            - task_key: Silver_unified
          notebook_task:
            notebook_path: databricks/gold/gold_analises_climaticas
            source: GIT
        - task_key: Dashboard_Monitoramento_climatico
          depends_on:
            - task_key: Gold
          dashboard_task:
            subscription:
              subscribers:
                - user_name: <subscriber-email>
            warehouse_id: <warehouse-id>
            dashboard_id: <dashboard-id>
      git_source:
        git_url: https://github.com/Lal3x/climate-lakehouse-azure.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      parameters:
        - name: ingestion_date
          default: "{{job.start_time.iso_date}}"
      performance_target: PERFORMANCE_OPTIMIZED
